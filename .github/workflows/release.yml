name: Release build

# Full Linux/Mac(arm64+x86_64)/Windows arm-softmmu build, packaged and
# attached to a GitHub Release. Only runs on version tags or manual
# dispatch -- NOT on every push (see build-check.yml for the cheap
# per-push sanity build). This is a release pipeline, not CI.
#
# Packaging scope (deliberately kept simple for now -- the project owner
# flagged this as still-TBD long-term, e.g. turning scripts/*.py into a
# library the eventual GUI imports directly instead of shelling out; do
# not build anything here that assumes today's packaging is permanent):
#
# - Linux: ONE direct asset PER ARCH, gwemu-<version>-x86_64.AppImage and
#   gwemu-<version>-aarch64.AppImage (contrib/appimage/build-appimage.sh)
#   -- the zero-argument GUI binary plus bundled libs in a single
#   executable file. It accepts explicit -M/-display arguments too, so no
#   separate qemu-system-arm asset. The aarch64 leg targets 64-bit
#   Raspberry Pi OS on a Pi 4/5 and builds natively on GitHub's
#   ubuntu-24.04-arm runner.
# - macOS: ONE direct asset, gwemu-<version>-macos-universal.dmg -- a
#   universal (arm64+x86_64 lipo-merged) self-contained gwemu.app
#   (dylibs in Contents/Frameworks, ad-hoc signed; per-arch recipe
#   validated on real Intel hardware 2026-07-24, arm64 slice smoke-
#   tested on the merge runner). The .app binary accepts explicit
#   -M/-display args, so no separate qemu-system-arm asset either.
# - scripts.zip: this project's own scripts/*.py, scripts/*.sh and
#   requirements.txt as ONE separate, optional asset (owner's call,
#   2026-07-24: binaries ready-to-go, scripts opt-in). Upstream QEMU's
#   own scripts/ are NOT included.
# - Windows: NO zip -- two direct assets, a fully static single-file
#   gwemu-portable.exe and gwemu-setup.exe (NSIS per-user installer).
#   No scripts, no qemu-system-arm.exe (owner's call, 2026-07-24).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Keep this list in sync with what's actually in scripts/ -- see
  # CLAUDE.md/STATUS.md for the current gnw-specific script inventory.
  GNW_SCRIPTS: >-
    boot_qemu.sh make_boot_images.py make_cfw_images.py make_sdcard_image.py
    fetch-sdk.sh gen_regs.py gen_stub.py checkpoint.py halt_at_entry.py
    lockstep_compare.py watch_write.py snapshot_registers.py
    diff_snapshots.py triage_diffs.py hotloop_sample.py hotloop_compare.py
    state_transplant.py state_transplant_hw_capture.py requirements.txt

jobs:
  build-linux:
    strategy:
      # Independent legs -- don't let one arch's failure cancel the
      # other's real pass/fail signal (same rationale as build-macos).
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            appimagetool_arch: x86_64
          # Native aarch64 GitHub-hosted runner (free for public repos) --
          # this is the Raspberry Pi 4/5 target. Native, not qemu-user
          # emulated: a full QEMU+SDL3 build under binfmt emulation takes
          # hours and has its own toolchain quirks.
          - runner: ubuntu-24.04-arm
            arch: aarch64
            appimagetool_arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Build inside an older-LTS container for a lower glibc floor than
    # ubuntu-latest's own base image would give us -- glibc's forward-only
    # symbol versioning means a binary built against a newer glibc won't
    # run against an older one on a user's machine, and there's no fully
    # equivalent fix from the build-host side alone. 22.04 is a deliberate
    # compatibility/toolchain-recency tradeoff, not verified against every
    # possible target distro.
    container: ubuntu:22.04
    # Container jobs don't get bash as the default `run:` shell the way
    # the standard ubuntu-latest runner does -- without this, `set -o
    # pipefail` fails with "Illegal option" under whatever /bin/sh this
    # image defaults to.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git (container has none by default)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          # Container jobs check out as a different UID than the one git
          # commands later run as -- without this, git refuses to touch
          # the checkout ("detected dubious ownership") and every git
          # command silently fails. Confirmed real: the packaged v0.0.2
          # binary shipped with a blank gwemu_commit (scripts/
          # gwemu-version.sh's `git rev-parse HEAD 2>/dev/null` was
          # swallowing this exact failure).
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev libsdl2-dev \
            python3 python3-pip build-essential zip \
            cmake libepoxy-dev liblzma-dev libpng-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev \
            libxcursor-dev libxss-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols libdecor-0-dev libdbus-1-dev libudev-dev
          # libpng-dev: without it QEMU's screendump has no PNG encoder,
          # and the headless timeline's `screenshot` action fails at
          # runtime with "Enable PNG support with libpng for screendump"
          # -- i.e. the shipped AppImage could run a timeline but never
          # capture from it. Found on a real Raspberry Pi 4 headless run
          # of the aarch64 asset; the x86_64 asset had the same gap.
          # liblzma-dev: contrib/gnw-tools/gnw_lzma.c (part of the CFW
          # patch-engine port, predates this GUI-wiring change but was
          # apparently never added to this workflow before) links system
          # liblzma directly -- required: true in that meson.build, so
          # configure hard-fails without it. Found via a real local
          # `docker run ubuntu:22.04` reproduction of this exact job,
          # not guessed.
          # cmake: gnw-h7b0 GUI's SDL3 dependency is fetched+built via
          # meson's cmake.subproject() (see meson.build's sdl3 handling),
          # not pkg-config/system-package -- meson needs a real `cmake`
          # binary on PATH to drive that.
          # libepoxy-dev: the GUI's GL dispatch library; without it meson
          # falls back to building subprojects/epoxy.wrap from source,
          # which works but is slower and an extra thing to go wrong --
          # prefer the real system package.
          # libx11-dev..libudev-dev: SDL3 is built STATIC (see
          # meson.build's SDL_STATIC/SDL_SHARED cmake defines) specifically
          # so gwemu doesn't need a separate libSDL3.so bundled -- but that
          # means whatever windowing backends (X11, Wayland) SDL3 can see
          # dev headers for AT BUILD TIME get compiled in permanently.
          # Skipping these would silently produce a gwemu binary with no
          # working Linux display backend at all on some end-user systems.

      - name: Install meson/ninja (pip, for a consistent recent version)
        run: |
          # tomli: meson's mkvenv bootstrap needs a TOML parser; stdlib
          # tomllib only exists on Python 3.11+, and ubuntu:22.04 ships
          # 3.10 -- without this, configure fails with "found no usable
          # tomli, please install it" before meson even starts.
          # pyyaml: subprojects/genconfig/gen_config.py (config_spec.yml ->
          # gwemu-config.h pipeline, needed by the GUI build) imports yaml
          # directly -- mkvenv's venv is non-isolated (inherits system
          # site-packages), so installing it here is enough.
          pip install tomli meson ninja pyyaml

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure --target-list=arm-softmmu

      - name: Build
        run: ninja -C build
        # Bare `ninja -C build` (no explicit target) is enough to also
        # produce `gwemu` here: its custom_target has build_by_default:
        # true (see meson.build's gwemu-binary-alias), unlike macOS's
        # signed qemu-system-arm custom_target below, which needs naming
        # explicitly.

      - name: Package (AppImage -- the single-file Linux asset)
        run: |
          set -euo pipefail
          # contrib/appimage/build-appimage.sh does what the old zip
          # packaging did (strip, bundle non-base-OS shared libs, an
          # LD_LIBRARY_PATH launcher -- glibc floor still comes from the
          # 22.04 container, see the container comment above) folded
          # into ONE executable file. No qemu-system-arm asset anymore:
          # the AppImage accepts the same explicit -M/-display arguments.
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends curl file
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool_arch }}.AppImage"
          chmod +x /usr/local/bin/appimagetool
          # No FUSE inside the container -- run appimagetool extracted.
          printf '%s\n' '#!/bin/sh' \
            'exec /usr/local/bin/appimagetool --appimage-extract-and-run "$@"' \
            > /usr/local/bin/appimagetool-wrapped
          chmod +x /usr/local/bin/appimagetool-wrapped
          src="$(find build -maxdepth 1 -type f -name qemu-system-arm)"
          if [ -z "$src" ]; then
            echo "qemu-system-arm not found under build/ -- build tree:" >&2
            find build -maxdepth 2 >&2
            exit 1
          fi
          # Conventional AppImage naming: gwemu-<version>-<arch>.AppImage
          # (workflow_dispatch runs have no tag -- fall back to the sha).
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v*) ;; *) VERSION="${GITHUB_SHA::8}" ;; esac
          NAME="gwemu-$VERSION-${{ matrix.arch }}.AppImage"
          APPIMAGETOOL=/usr/local/bin/appimagetool-wrapped ARCH=${{ matrix.arch }} \
            contrib/appimage/build-appimage.sh "$src" "$NAME"
          mkdir linux-bin && mv "$NAME" linux-bin/

      - name: Stage scripts artifact (once, from the x86_64 leg only)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          # Owner's call (2026-07-24): the per-platform zips are pure
          # ready-to-run runtime; the gnw scripts ship once as their own
          # separate, optional scripts.zip asset instead of being copied
          # into every platform zip.
          mkdir -p scripts-pkg/scripts
          for f in $GNW_SCRIPTS; do
            cp "scripts/$f" scripts-pkg/scripts/
          done

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: scripts
          path: scripts-pkg/
          # publish-release's zip loop turns this artifact dir into
          # scripts.zip (containing a scripts/ folder) exactly like the
          # platform dirs.

      - uses: actions/upload-artifact@v4
        with:
          name: gwemu-linux-${{ matrix.arch }}-bin
          path: linux-bin/
          # Single-file direct asset (like the Windows exes):
          # publish-release moves it out un-zipped and restores its exec
          # bit (upload-artifact@v4 strips permissions).

  build-macos:
    strategy:
      # Default fail-fast cancels the arm64 leg the instant x86_64 fails
      # (or vice versa) even though they're fully independent builds --
      # masked real signal during CI debugging (arm64 showed "cancelled"
      # instead of its own real pass/fail). Independent legs, no reason
      # to couple their outcomes.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-14
            arch: x86_64
        # Both legs run on macos-14 (arm64 host). The x86_64 leg used to
        # run on a native macos-13 (Intel) runner, but those have been
        # observed stuck queued for 6+ hours with no runner ever picking
        # them up -- a known GH Actions scarcity issue with Intel macOS
        # runners specifically. Apple Clang on arm64 can natively
        # cross-compile to x86_64 via -arch, so we do that instead of
        # waiting on a scarce runner at all.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (arm64 leg)
        if: matrix.arch == 'arm64'
        run: |
          # libpng: QEMU's screendump has no PNG encoder without it, so
          # the headless timeline's `screenshot` action fails at runtime
          # ("Enable PNG support with libpng for screendump"). Confirmed
          # missing from the shipped 0.0.14 universal DMG.
          brew install ninja pkg-config glib pixman sdl2 meson dylibbundler cmake libepoxy xz libpng
          # pyyaml: subprojects/genconfig/gen_config.py needs it; mkvenv's
          # venv is non-isolated so a system/user install is enough.
          pip3 install --user --break-system-packages pyyaml || pip3 install --user pyyaml

      - name: Install build dependencies (x86_64 cross leg)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          # arm64 Homebrew (/opt/homebrew) formulae are arm64-only --
          # their .dylibs can't link into an x86_64 binary. macos-14
          # runners have Rosetta 2, so install a SEPARATE x86_64 Homebrew
          # under /usr/local (the classic Intel prefix) via `arch -x86_64`
          # and get real x86_64 glib/pixman/sdl2/libepoxy/liblzma from it.
          # meson/ninja/cmake/pkg-config/dylibbundler stay arm64 (host
          # tools, never linked into the target binary).
          brew install ninja meson cmake dylibbundler pkg-config
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          arch -x86_64 /usr/local/bin/brew install pkg-config glib pixman sdl2 libepoxy xz libpng
          # pyyaml: subprojects/genconfig/gen_config.py needs it; mkvenv's
          # venv is non-isolated so a system/user install is enough. This
          # leg still runs meson/mkvenv under the arm64 (host) Python.
          pip3 install --user --break-system-packages pyyaml || pip3 install --user pyyaml

      - name: Configure
        env:
          GNW_CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch == 'x86_64' && 'x86_64' || '' }}
        run: |
          mkdir build
          cd build
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # Cross-compile from this arm64 runner: -arch x86_64 tells
            # Apple Clang to emit x86_64 code/link an x86_64 binary
            # directly, no separate cross-toolchain needed. Point
            # pkg-config at the x86_64 Homebrew prefix (/usr/local) so it
            # resolves glib/pixman/sdl2/libepoxy/liblzma to real x86_64
            # libs instead of the arm64 ones under /opt/homebrew.
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig"
            export PKG_CONFIG_LIBDIR="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig"
            # --cross-prefix= (even empty) is what actually flips
            # configure's own cross_compile flag to "yes" -- without it,
            # --cpu=x86_64 alone never triggers writing a real
            # [host_machine] section into config-meson.cross, so meson
            # still believed the host was aarch64 despite the -arch
            # flags, and QEMU's own host-arch-conditional code (e.g.
            # crypto/aes-round.h's separate NEON vs x86_64 accel paths)
            # picked the wrong (ARM NEON) implementation entirely --
            # confirmed via real build failures, not a hypothetical.
            # With this, configure also emits config-meson.native so
            # build-time tools (code generators, meson's own machinery)
            # correctly still run as native arm64, not under Rosetta.
            ../configure --target-list=arm-softmmu --cpu=x86_64 \
              --cross-prefix= \
              --extra-cflags="-arch x86_64" \
              --extra-cxxflags="-arch x86_64" \
              --extra-ldflags="-arch x86_64" \
              --disable-sdl \
              --disable-vnc --disable-gnutls --disable-nettle --disable-gcrypt \
              --disable-curl --disable-libssh --disable-curses --disable-libusb \
              --disable-zstd --disable-dbus-display --disable-png --disable-gio
          else
            ../configure --target-list=arm-softmmu --disable-sdl \
              --disable-vnc --disable-gnutls --disable-nettle --disable-gcrypt \
              --disable-curl --disable-libssh --disable-curses --disable-libusb \
              --disable-zstd --disable-dbus-display --disable-png --disable-gio
          fi
          # The --disable-vnc..--disable-png block pins the OPTIONAL
          # feature set identically on both legs: the arm64 runner's
          # preinstalled Homebrew otherwise auto-enables a pile of
          # features (gnutls+its chain, vnc jpeg/png, libusb, zstd,
          # gio) the minimal x86_64 prefix doesn't have, and the
          # universal merge job (correctly) refuses to lipo two apps
          # with different dylib sets -- exactly how v0.0.12's first
          # run failed. None of these features are part of what gwemu
          # ships (same trimming rationale as the static Windows exe).
          # --disable-sdl: QEMU's own legacy `-display sdl` backend (SDL2,
          # separate from our GUI's SDL3) -- our GUI (`-display gwemu`)
          # supersedes it entirely, and a real user's crash report on a
          # genuine Intel Mac (macOS 26.5, iMac20,2) showed the bundled
          # libSDL2-2.0.0.dylib aborting inside its own dyld initializer
          # (dllinit) before main() even ran -- SDL2 2.0.x's own
          # compatibility with this new macOS version, not our code.
          # Not needed for anything this product ships, so don't link it
          # (or bundle it) at all rather than chase that compatibility gap.

      - name: Build
        run: |
          # On Darwin, meson defines qemu-system-arm as a custom_target
          # that ad-hoc-codesigns/entitles the plain executable (built as
          # qemu-system-arm-unsigned) via scripts/entitlement.sh -- but
          # that custom_target isn't part of ninja's default "all" set, so
          # a bare `ninja -C build` only produces the unsigned binary.
          # Build the signed target explicitly, and gwemu (its own
          # custom_target, copies whichever qemu-system-arm this same
          # invocation just produced) alongside it in the same command --
          # naming qemu-system-arm explicitly here means ninja does NOT
          # fall back to build_by_default for anything else, so gwemu
          # needs to be requested too or it won't get built at all.
          ninja -C build qemu-system-arm gwemu

      - name: Verify binary architecture
        run: |
          set -euo pipefail
          for bin in build/qemu-system-arm build/gwemu; do
            got="$(lipo -archs "$bin" 2>/dev/null || file -b "$bin")"
            echo "$bin: $got"
            case "$got" in
              *${{ matrix.arch }}*) ;;
              *) echo "ERROR: $bin is not ${{ matrix.arch }} (got: $got)" >&2; exit 1 ;;
            esac
          done

      - name: Verify SDL3 is actually statically linked
        run: |
          set -euo pipefail
          # meson.build builds SDL3 with SDL_STATIC=ON/SDL_SHARED=OFF
          # specifically so no separate libSDL3 dylib is ever needed at
          # runtime -- a real user hit "Failed loading SDL3 library" on
          # the x86_64 build, which would make sense if this leg's
          # cross-compiled SDL3 build ended up dynamic instead (untested
          # hypothesis, can't reproduce locally). Print the full
          # dependency list either way so this is visible in the log,
          # and fail loudly if SDL3 shows up as a dynamic dependency.
          echo "--- gwemu dependencies ---"
          otool -L build/gwemu
          if otool -L build/gwemu | grep -qi 'libSDL3'; then
            echo "ERROR: gwemu dynamically links libSDL3 -- meson.build's SDL_STATIC=ON isn't taking effect on this leg" >&2
            exit 1
          fi

      - name: Package (gwemu.app in a DMG -- the single-file macOS asset)
        run: |
          set -euo pipefail
          # Recipe validated end-to-end on a real Intel Mac (macOS 26.5,
          # 2026-07-24): self-contained gwemu.app, dylibs hidden in
          # Contents/Frameworks, launched fine from the mounted DMG.
          # No separate qemu-system-arm asset -- the .app binary accepts
          # the same explicit -M/-display arguments
          # (gwemu.app/Contents/MacOS/gwemu ... from a shell).
          src="$(find build -maxdepth 1 -type f -name gwemu)"
          if [ -z "$src" ]; then
            echo "gwemu not found under build/ -- build tree:" >&2
            find build -maxdepth 2 >&2
            exit 1
          fi

          APP=dist-macos/gwemu.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks"
          # sed strips the YAML block indentation the heredoc inherits --
          # the <?xml?> declaration must start at column 0 (same class of
          # trap as the printf-not-heredoc note in the old Linux job).
          sed 's/^[[:space:]]*//' > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>org.gwemu.gwemu</string>
            <key>CFBundleName</key><string>GWemu</string>
            <key>CFBundleExecutable</key><string>gwemu</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          cp "$src" "$APP/Contents/MacOS/gwemu"
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/gwemu" \
            -d "$APP/Contents/Frameworks/" \
            -p "@executable_path/../Frameworks/"
          # CRITICAL: dylibbundler rewrites EVERY existing LC_RPATH (the
          # qemu binary carries ~12 from subproject/Homebrew paths) to
          # the same @executable_path/../Frameworks/ value, and modern
          # dyld hard-aborts on duplicate LC_RPATH ("dyld: duplicate
          # LC_RPATH") -- the app dies instantly without this dedup.
          # Zero remaining rpaths is fine: dylibbundler rewrites the
          # dylib load commands themselves to @executable_path paths.
          B="$APP/Contents/MacOS/gwemu"
          n=$(otool -l "$B" | grep -c 'path @executable_path/../Frameworks/' || true)
          while [ "$n" -gt 1 ]; do
            install_name_tool -delete_rpath "@executable_path/../Frameworks/" "$B" 2>/dev/null || true
            n=$((n-1))
          done
          # install_name_tool invalidates the signature -- the bundle
          # re-sign must come AFTER the rpath fix (dylibbundler's own
          # per-file ad-hoc signing is fine underneath).
          codesign --force --deep -s - "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: gwemu-macos-${{ matrix.arch }}-app
          path: dist-macos/
          # Intermediate (NOT a release asset): merge-macos-universal
          # lipo-merges both arch .apps into the one universal DMG.
          # artifact@v4 strips exec bits; the merge job restores them.

  # lipo both arch .apps into ONE universal gwemu.app / DMG -- the only
  # macOS release asset (xemu's macos-universal model). The main binary
  # AND every bundled dylib get fat-merged pairwise; the two Homebrew
  # prefixes (/opt/homebrew vs /usr/local) can drift in what dylibs they
  # pull in, so a set mismatch FAILS the job instead of silently
  # shipping a half-universal app that dies on one arch.
  merge-macos-universal:
    needs: [build-macos]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gwemu-macos-arm64-app
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: gwemu-macos-x86_64-app
          path: x86_64

      - name: Merge, sign, DMG
        run: |
          set -euo pipefail
          A=arm64/gwemu.app
          X=x86_64/gwemu.app

          diff <(cd "$A/Contents/Frameworks" && ls | sort) \
               <(cd "$X/Contents/Frameworks" && ls | sort) || {
            echo "Frameworks sets differ between arches (see diff above)" >&2
            exit 1
          }

          mkdir -p dist-macos
          cp -R "$A" dist-macos/gwemu.app
          U=dist-macos/gwemu.app
          lipo -create "$A/Contents/MacOS/gwemu" "$X/Contents/MacOS/gwemu" \
               -output "$U/Contents/MacOS/gwemu"
          for f in "$A"/Contents/Frameworks/*.dylib; do
            b="$(basename "$f")"
            lipo -create "$f" "$X/Contents/Frameworks/$b" \
                 -output "$U/Contents/Frameworks/$b"
          done
          chmod +x "$U/Contents/MacOS/gwemu"
          lipo -info "$U/Contents/MacOS/gwemu"
          # lipo output is unsigned; ad-hoc sign the merged bundle.
          codesign --force --deep -s - "$U"
          ln -s /Applications dist-macos/Applications

          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v*) ;; *) VERSION="${GITHUB_SHA::8}" ;; esac
          mkdir macos-dmg
          hdiutil create -volname GWemu -srcfolder dist-macos -ov -format UDZO \
            "macos-dmg/gwemu-$VERSION-macos-universal.dmg"

      - name: Smoke test (native arch of this runner)
        run: |
          set -euo pipefail
          # macos-14 = arm64: launching the universal app here exercises
          # the arm64 slice (the x86_64 slice was validated on real
          # Intel hardware when the recipe landed). Alive after 10s with
          # sane startup output = pass.
          ./dist-macos/gwemu.app/Contents/MacOS/gwemu > out.log 2>&1 &
          pid=$!
          sleep 10
          kill -0 "$pid" || { echo "app died:"; cat out.log; exit 1; }
          kill "$pid" || true
          grep -E "gwemu_version|SDL_RENDERER" out.log

      - uses: actions/upload-artifact@v4
        with:
          name: gwemu-macos-universal-dmg
          path: macos-dmg/
          # Single-file direct asset -- publish-release moves the .dmg
          # out un-zipped (a DMG needs no exec bit, unlike the AppImage).

  build-windows:
    # Cross-compiled from Linux in the MXE-based static toolchain
    # (contrib/docker-win-static/, derived from xemu's public toolchain
    # image): every dependency including glib is a static .a, so the
    # result is a SINGLE self-contained gwemu.exe importing only Windows
    # system DLLs -- xemu's own distribution model. This replaced the
    # fedora-win64-cross + bundled-DLLs job (v0.0.11 and earlier zips);
    # Windows ships two direct (un-zipped) release assets:
    # gwemu-portable.exe and gwemu-setup.exe (NSIS per-user installer, see
    # contrib/gwemu-installer/gwemu.nsi). No scripts/, no
    # qemu-system-arm.exe -- owner's call, Windows users don't use them.
    # --disable-sdl/--disable-sdl-image: QEMU's legacy SDL2 display, not
    # our SDL3 GUI (statically built via its cmake subproject).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static toolchain image
        run: docker build -t gwemu-win-static contrib/docker-win-static/

      - name: Configure and build (inside static cross container)
        run: |
          set -euo pipefail
          mkdir -p build-win-static
          docker run --rm -v "$PWD":/src -w /src/build-win-static gwemu-win-static \
            bash -c 'git config --global --add safe.directory "*" \
                   && ../configure --target-list=arm-softmmu \
                        --cross-prefix=x86_64-w64-mingw32.static- \
                        --disable-sdl --disable-sdl-image --disable-gtk \
                   && ninja -j"$(nproc)" qemu-system-arm.exe gwemu.exe \
                   && x86_64-w64-mingw32.static-strip gwemu.exe'
          # safe.directory: container runs as root against a runner-owned
          # checkout -- without it gwemu_commit silently stamps blank
          # (bit for real twice now: the v0.0.2 zip and a local
          # container rebuild). gwemu.exe is the meson alias copy with
          # the GUI-subsystem flip already applied
          # (scripts/make-gwemu-alias.py); stripping preserves the PE
          # optional header, i.e. the subsystem flip survives.

      - name: Verify the exe is genuinely self-contained
        run: |
          set -euo pipefail
          # Guardrail: fail the release if the static link regressed and
          # the exe picked up a non-system DLL import (same silent-drift
          # class as the GUI-less macOS assets). Whitelist = Windows
          # system DLLs only (api-ms-win-* covered by the last pattern).
          docker run --rm -v "$PWD":/src -w /src/build-win-static gwemu-win-static \
            bash -c 'x86_64-w64-mingw32.static-objdump -p gwemu.exe \
                       | grep "DLL Name" | awk "{print \$3}"' \
            | grep -viE '^(ADVAPI32|CRYPT32|DNSAPI|GDI32|IMM32|IPHLPAPI|KERNEL32|SETUPAPI|SHELL32|SHLWAPI|Secur32|USER32|VERSION|WININET|WINMM|WLDAP32|WS2_32|bcrypt|msvcrt|ole32|OLEAUT32|api-ms-win-.*)\.dll$' \
            && { echo "Unexpected non-system DLL import(s) above"; exit 1; } || true

      - name: Build NSIS installer
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p win-installer-stage
          cp build-win-static/gwemu.exe win-installer-stage/
          cp LICENSE win-installer-stage/LICENSE.txt
          cp COPYING win-installer-stage/COPYING.txt
          # The MXE image is Ubuntu-based; nsis comes from apt there.
          docker run --rm -v "$PWD":/src -w /src gwemu-win-static \
            bash -c "apt-get update -q && apt-get install -qy nsis >/dev/null \
                     && makensis -DDISTDIR=/src/win-installer-stage \
                          -DVERSION='$VERSION' \
                          -DOUTFILE=/src/gwemu-setup.exe \
                          contrib/gwemu-installer/gwemu.nsi"

      - name: Stage artifact
        run: |
          set -euo pipefail
          # One flat directory: multi-path upload-artifact preserves the
          # common-ancestor directory structure, which publish-release
          # would then have to un-nest -- avoid that entirely.
          mkdir win-exes
          cp build-win-static/gwemu.exe win-exes/gwemu-portable.exe
          cp gwemu-setup.exe win-exes/

      - uses: actions/upload-artifact@v4
        with:
          name: gwemu-windows-exes
          # Both files ship as DIRECT release assets -- publish-release
          # moves the contents of this artifact out un-zipped instead of
          # zipping the directory like the other platforms.
          path: win-exes/

  # Fifth platform build: the headless capture appliance image
  # (contrib/docker-headless/, see docs/headless-capture.md), published to
  # Docker Hub as slashproc/gwemu-headless. Tag cascade per release vX.Y.Z:
  # X, X.Y, and X.Y.Z -- so ":X" always tracks the highest minor.patch of
  # that major, ":X.Y" the highest patch of that minor. ":latest" is also
  # pushed (owner's call: convenient, if a bit shitty -- prefer pinning).
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          # Build FROM THE REPO ROOT (the Dockerfile requires it: its
          # build stage COPYs the source tree, fenced by .dockerignore).
          docker build -t gwemu-headless -f contrib/docker-headless/Dockerfile .

      - name: Push semver tag cascade
        # Tag-triggered runs only: workflow_dispatch has no version to
        # derive, so it stops after the build (still a useful smoke test).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"           # v1.2.3 -> 1.2.3
          case "$VER" in
            *.*.*) : ;;
            *) echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          MAJ="${VER%%.*}"
          MIN="${VER%.*}"                       # 1.2.3 -> 1.2
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login -u slashproc --password-stdin
          for tag in "$MAJ" "$MIN" "$VER" latest; do
            docker tag gwemu-headless "slashproc/gwemu-headless:$tag"
            docker push "slashproc/gwemu-headless:$tag"
          done

  publish-release:
    needs: [build-linux, merge-macos-universal, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # NO merge-multiple: upload-artifact@v4 archives a directory's
          # CONTENTS (lib/, scripts/, loose binaries), not the directory
          # itself -- merging all platforms into one pot made the zip
          # loop below produce lib.zip/libs.zip/scripts.zip while every
          # platform binary sat unzipped at the root (broken releases
          # v0.0.2..v0.0.10). Without merging, each artifact lands in
          # artifacts/<artifact-name>/ and the loop zips one complete
          # per-platform directory per asset, v0.0.1-style.

      - name: Zip each platform's directory (exactly once)
        run: |
          set -euo pipefail
          cd artifacts
          # upload/download-artifact@v4 round-trips files through its own
          # zip and DROPS permission bits, so the chmod +x done in the
          # build jobs is gone by the time we get here. Restore exec bits
          # on the Linux/macOS binaries, launchers and scripts before the
          # real zip (zip -r does preserve them). Windows doesn't care.
          chmod +x scripts/scripts/* 2>/dev/null || true
          # Windows exes and the Linux AppImage ship as DIRECT un-zipped
          # assets -- move them out before the zip loop so they don't
          # get wrapped. The AppImage needs its exec bit restored
          # (artifact@v4 strips permissions; a non-executable AppImage
          # is dead on arrival).
          if [ -d gwemu-windows-exes ]; then
            mv gwemu-windows-exes/* ..
            rm -rf gwemu-windows-exes
          fi
          for d in gwemu-linux-*-bin; do
            [ -d "$d" ] || continue
            chmod +x "$d"/*
            mv "$d"/* ..
            rm -rf "$d"
          done
          for d in gwemu-macos-*-dmg; do
            [ -d "$d" ] || continue
            mv "$d"/*.dmg ..
            rm -rf "$d"
          done
          for d in */; do
            d="${d%/}"
            zip -r "../$d.zip" "$d"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.AppImage
            *.dmg
            gwemu-portable.exe
            gwemu-setup.exe
          draft: true
          generate_release_notes: true
