name: Build check

# Fast, cheap sanity check: does gnw-h7b0 still build and register as a
# machine. Runs on every push/PR. NOT the release pipeline (see
# release.yml for the full Linux/Mac/Windows release build, which only
# runs on tags/manual dispatch) -- this job intentionally only builds
# Linux and only checks that the binary exists and the board is present.

on:
  push:
  pull_request:

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a native aarch64 GitHub-hosted runner (free
        # for public repos) -- covers the Raspberry Pi 4/5 target.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev libsdl2-dev liblzma-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install meson/ninja (pip, for a consistent recent version)
        run: pip install meson ninja pyyaml

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure --target-list=arm-softmmu

      - name: Build
        run: ninja -C build

      - name: Smoke check -- gnw-h7b0 machine registered
        run: |
          ./build/qemu-system-arm -M help | grep -q gnw-h7b0 || {
            echo "gnw-h7b0 machine not found in -M help output" >&2
            exit 1
          }
