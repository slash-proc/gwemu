name: Build check

# Every default-branch update runs the full release build matrix as a
# validation build. The reusable release workflow skips publication for
# this caller.
on:
  push:
    branches:
      - gnw-h7b0

# Shared with the tag-triggered Release workflow: never consume build
# resources for both full matrices at the same time.
concurrency:
  group: gwemu-release-or-build-check
  cancel-in-progress: false

jobs:
  all-release-targets:
    uses: ./.github/workflows/release.yml
    # GitHub validates permissions across the entire called workflow,
    # including the tag-only publish job, even when build_check skips it.
    # This workflow runs only on trusted default-branch pushes.
    permissions:
      contents: write
    with:
      build_check: true
